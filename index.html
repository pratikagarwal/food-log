<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Log - Pratik Agarwal</title>
<style>
  :root { color-scheme: light; --ink:#1f2a24; --muted:#5e6b64; --line:#dfe7e2; --green:#276749; --green-soft:#edf7f1; --cream:#fbfaf7; --amber:#946200; --amber-soft:#fff7df; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f1f4f2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:16px; line-height:1.55; }
  main { width:min(100% - 28px,760px); margin:28px auto; background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 30px rgba(31,42,36,.07); overflow:hidden; }
  header { padding:34px 38px 26px; background:linear-gradient(135deg,#f6fbf8 0%,#fff 70%); border-bottom:1px solid var(--line); }
  h1 { margin:0 0 8px; font-size:clamp(1.65rem,4vw,2.25rem); line-height:1.18; letter-spacing:-.025em; }
  .name { margin:0; color:var(--green); font-size:1.05rem; font-weight:700; }
  section { padding:28px 38px; }
  section + section { border-top:1px solid var(--line); }
  h2 { margin:0 0 16px; font-size:1.15rem; letter-spacing:.01em; }
  .context { background:var(--green-soft); border:1px solid #d4eadd; border-radius:13px; padding:18px 20px; }
  .context p { margin:0 0 8px; }
  .context p:last-child { margin-bottom:0; color:var(--muted); font-size:.94rem; }
  .entries { list-style:none; padding:0; margin:0; }
  .entry { display:grid; grid-template-columns:92px 1fr; gap:16px; padding:19px 0; border-bottom:1px solid var(--line); }
  .entry:first-child { padding-top:0; }
  .entry:last-child { padding-bottom:0; border-bottom:0; }
  .time { color:var(--green); font-weight:750; font-size:.94rem; white-space:nowrap; }
  .item { margin:0 0 5px; font-weight:650; }
  .estimate { margin:0; color:var(--muted); font-size:.94rem; }
  figure { margin:16px 0 2px; }
  img { display:block; width:100%; max-height:520px; object-fit:cover; border-radius:12px; border:1px solid var(--line); background:#eee; }
  figcaption { margin-top:8px; color:var(--muted); font-size:.88rem; }
  .planned { display:inline-block; margin-bottom:8px; padding:3px 9px; border-radius:999px; background:var(--amber-soft); color:var(--amber); font-size:.78rem; font-weight:750; text-transform:uppercase; letter-spacing:.04em; }
  .totals { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .total { padding:17px 18px; border-radius:12px; background:var(--cream); border:1px solid var(--line); }
  .total strong { display:block; margin-bottom:6px; color:var(--green); font-size:.88rem; text-transform:uppercase; letter-spacing:.035em; }
  .total span { display:block; font-size:1.04rem; font-weight:700; }
  footer { padding:18px 38px 24px; color:var(--muted); font-size:.82rem; text-align:center; background:var(--cream); border-top:1px solid var(--line); }
  @media (max-width:560px) { header,section { padding-left:22px; padding-right:22px; } .entry { grid-template-columns:76px 1fr; gap:12px; } .totals { grid-template-columns:1fr; } footer { padding-left:22px; padding-right:22px; } }
</style>
</head>
<body>
<main><header><h1>Food Log</h1><p class="name">Pratik Agarwal</p></header><div id="app"></div><footer>Food and nutrition estimates are approximate.</footer></main>
<script>
const days=[
{label:'Friday, September 25, 2026',entries:[
{time:'9:30 AM',item:'Cosmix protein shake, 1 scoop (38g)',estimate:'Estimate: ~24g protein, ~135 kcal, ~1g sugar'},
{time:'1:05 PM',item:"Lunch (today's menu): Quinoa Fried Rice with Tofu and Vegetables + Veg Clear Soup - no Gobbleright Beetroot Quinoa Wrap on the plate",estimate:'Estimate: ~33g protein, ~775 kcal, ~14g sugar, by container volume - Mepal Take a Break Large: quinoa fried rice with tofu and veg fills both tray sections (~800ml of the ~900ml divided tray, ~570g: ~28g / ~630 kcal / ~7g sugar); veg clear soup ~80% of the 600ml container (~480ml: ~5g / ~145 kcal / ~7g sugar) (±15%)'},
{time:'5:10 PM',item:'Cosmix protein shake, 1 scoop (38g)',estimate:'Estimate: ~24g protein, ~135 kcal, ~1g sugar'}
]},
{label:'Thursday, September 24, 2026',entries:[]},{label:'Wednesday, September 23, 2026',entries:[]},{label:'Tuesday, September 22, 2026',entries:[]},{label:'Monday, September 21, 2026',entries:[]},{label:'Sunday, September 20, 2026',entries:[]},{label:'Saturday, September 19, 2026',entries:[]},{label:'Friday, September 18, 2026',entries:[]},{label:'Thursday, September 17, 2026',entries:[]},{label:'Wednesday, September 16, 2026',entries:[]},{label:'Tuesday, September 15, 2026',entries:[]}
];
const app=document.getElementById('app');
const nav=document.createElement('nav'); nav.id='day-tabs'; nav.setAttribute('role','tablist'); app.appendChild(nav);
days.forEach((day,i)=>{const s=document.createElement('section');s.className='tab-panel';s.id='day-'+i;s.hidden=i!==0;const h=document.createElement('h2');h.textContent=day.label;s.appendChild(h);const ul=document.createElement('ul');ul.className='entries';day.entries.forEach(e=>{const li=document.createElement('li');li.className='entry';li.innerHTML=`<span class="time">${e.time}</span><div><p class="item"></p><p class="estimate"></p></div>`;li.querySelector('.item').textContent=e.item;li.querySelector('.estimate').textContent=e.estimate;ul.appendChild(li)});s.appendChild(ul);if(i===0){const t=document.createElement('h2');t.textContent='Estimated totals';s.appendChild(t);const totals=document.createElement('p');totals.textContent='DAY TOTAL ~81g protein, ~1,045 kcal, ~16g sugar';s.appendChild(totals)}app.appendChild(s);const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',String(i===0));b.textContent=day.label.replace(/^(\w+), (\w+) (\d+),.*/,(_,w,m,d)=>`${w.slice(0,3)}, ${m.slice(0,3)} ${d}`);b.onclick=()=>{document.querySelectorAll('.tab-panel').forEach((p,j)=>p.hidden=j!==i);document.querySelectorAll('[role=tab]').forEach((x,j)=>x.setAttribute('aria-selected',String(j===i)))};nav.appendChild(b)});
</script>
</body>
</html>
